<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>2026 Vision Board</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/cards.css">
</head>

<body>

<!-- Intro Overlay -->
<div id="intro-overlay">
  <div class="sparkle-container">
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>
    <div class="sparkle s5"></div>
  </div>
  
  <!-- Floating Butterflies and Stars -->
  <div class="floating-element b1">🦋</div>
  <div class="floating-element b2">🦋</div>
  <div class="floating-element b3">🦋</div>
  <div class="floating-element fs1">⭐</div>
  <div class="floating-element fs2">✨</div>
  <div class="floating-element fs3">⭐</div>

  <div class="intro-text">✨ 2026 ✨</div>
</div>

<div class="vision-wrapper">

  <!-- Stickers -->
  <img src="assets/stickers/girl.png" class="sticker mid" id="sticker-girl">
  <img src="assets/stickers/heel.png" class="sticker mid" id="sticker-heel">
  <img src="assets/stickers/smoke.png" class="sticker small" id="sticker-smoke">
  <img src="assets/stickers/music.png" class="sticker small" id="sticker-music">
  <img src="assets/stickers/cig.png" class="sticker big" id="sticker-cig">

  <!-- Heading -->
<header class="vision-title">
  <img
    src="assets/title/title.png"
    alt="2026 Vision Board"
  />
</header>

  <main class="board">


  <!-- ================= CAREER ================= -->
  <div class="card" data-section="career">
    <div class="card-inner">

      <div class="card-front career"></div>

      <div class="card-back">
        <div class="card-back-content">
  <h3>Career and Goals</h3>

  <ul class="goals">
  </ul>
</div>

<div class="card-back-actions">
  <button class="open-btn pink">💗 My Achievements</button>
</div>
      </div>

    </div>
  </div>

  <!-- ================= HEALTH ================= -->
  <div class="card" data-section="health">
    <div class="card-inner">

      <div class="card-front health"></div>

      <div class="card-back">
        <div class="card-back-content">
  <h3>Health & Fitness</h3>

  <ul class="goals">
  </ul>
</div>

<div class="card-back-actions">
  <button class="open-btn pink">💗 My Achievements</button>
</div>
      </div>

    </div>
  </div>

  <!-- ================= LIFESTYLE ================= -->
  <div class="card" data-section="lifestyle">
    <div class="card-inner">

      <div class="card-front lifestyle"></div>

      <div class="card-back">
       <div class="card-back-content">
  <h3>Life style and Joy</h3>

  <ul class="goals">
  </ul>
</div>

<div class="card-back-actions">
  <button class="open-btn pink">💗 My Achievements</button>
</div>
      </div>

    </div>
  </div>

  <!-- ================= MONEY ================= -->
  <div class="card" data-section="money">
    <div class="card-inner">

      <div class="card-front money"></div>

      <div class="card-back">
        <div class="card-back-content">
  <h3>Money and Independance</h3>

  <ul class="goals">
  </ul>
</div>

<div class="card-back-actions">
  <button class="open-btn pink">💗 My Achievements</button>
</div>
      </div>

    </div>
  </div>

  <!-- ================= MINDSET ================= -->
  <div class="card" data-section="mindset">
    <div class="card-inner">

      <div class="card-front mindset"></div>

      <div class="card-back">
        <div class="card-back-content">
  <h3>Mindset and selfcare</h3>

  <ul class="goals">
  </ul>
</div>

<div class="card-back-actions">
  <button class="open-btn pink">💗 My Achievements</button>
</div>


      </div>

    </div>
  </div>

  <!-- ================= HOBBIES ================= -->
  <div class="card" data-section="hobbies">
    <div class="card-inner">

      <div class="card-front hobbies"></div>

      <div class="card-back">
        <div class="card-back-content">
  <h3>Hobbies and Skills</h3>

  <ul class="goals">
  </ul>
</div>

<div class="card-back-actions">
  <button class="open-btn pink">💗 My Achievements</button>
</div>


      </div>

    </div>
  </div>

  </main>

</div> <!-- end vision-wrapper -->

<script src="js/cards.js"></script>

</body>
</html>
